spring:
  application:
    name: seerhub
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:seerhub}
    username: ${POSTGRES_USER:seerhub}
    password: ${POSTGRES_PASSWORD:seerhub}
  jpa:
    hibernate:
      ddl-auto: validate      # NUNCA update/create/create-drop, em nenhum perfil
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    deserialization:
      accept-float-as-int: false   # sem isto, "12.50" seria truncado em silêncio para 12 (F02, D-12)
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized   # dívida de F00 fechada por F01: só autenticados veem "components"
      probes:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  structured:
    format:
      console: ecs              # logs JSON com MDC (inclui correlationId)

seerhub:
  security:
    jwt-secret: ${JWT_SECRET}                 # sem omissão: obrigatório
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  football:
    api-key: ${API_FOOTBALL_KEY:}             # vazio é válido: F05 valida quando sincroniza
    base-url: ${API_FOOTBALL_BASE_URL:https://v3.football.api-sports.io}
    provider: api-football                    # "fake" só no perfil de teste
    daily-budget: ${API_FOOTBALL_DAILY_BUDGET:100}
    catalog-reserve: 20                       # unidades que os resultados nunca gastam
    season: ${API_FOOTBALL_SEASON:}           # vazio = derivada do relógio
    catalog-cron: "0 7 */12 * * *"            # 00:07 e 12:07 UTC — 12h de periodicidade
    catalog-horizon: P7D
    result-cron: "0 */15 * * * *"
    result-delay: PT2H                        # só olha para jogos começados há 2h+
    result-window: P7D                        # e ainda não há mais de 7 dias
    min-result-interval: PT30M                # não repete o mesmo grupo antes disto
    max-groups-per-run: 4
    request-timeout: PT10S
    crest-downloads-per-run: 50
    leagues:
      - provider-id: 94
        name: Primeira Liga
        country: Portugal
      - provider-id: 39
        name: Premier League
        country: England
      - provider-id: 140
        name: La Liga
        country: Spain
      - provider-id: 135
        name: Serie A
        country: Italy
      - provider-id: 78
        name: Bundesliga
        country: Germany
      - provider-id: 61
        name: Ligue 1
        country: France
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
